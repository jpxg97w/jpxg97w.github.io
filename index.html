<html>
  <head>
    <title>Redirect</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <button>click</button>
    <script type="module">
      import parseDataURL from 'https://unpkg.com/data-urls?module';
      (() => {
        const { hash } = location;
        const payload = hash.slice(1);
        if (!payload.length) return;
        const { body, mimeType } = parseDataURL(payload);
        const blob = new Blob([body], { type: mimeType.toString() });
        const redirect = URL.createObjectURL(blob);
        location.replace(redirect);
      })();
    </script>
  </body>
</html>
