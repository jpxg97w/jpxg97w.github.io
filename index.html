<html>
  <head>
    <title>Redirect to Blob</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="display:flex;flex-direction:column;gap:3rem;">
    <a>click me</a>
    <input type="text">
    <button>[isRedirectEnabled]</button>
    <pre id="hash-debug" style="max-width:80vw;overflow:scroll;"></pre>
    <pre id="data-debug" style="max-width:80vw;max-height:40vh;overflow:scroll;"></pre>
    <pre id="redirect-debug"></pre>

    <script type="module">
      const parseDataUrl = new RegExp('^data:(?<type>.+?/.+?)?(?:;(?<params>.+?))?,(?<data>.*)$');
      const parseParam = new RegExp('^(?<key>.+?)(?:=(?<value>.*))?$');

      /**
       * @type {HTMLAnchorElement | null}
      */
      const link = document.querySelector('a');

      /**
       * @type {HTMLInputElement | null}
      */
      const input = document.querySelector('input');

      /**
       * @type {HTMLButtonElement | null}
      */
      const redirectEnableButton = document.querySelector('button');

      /**
       * @type {HTMLPreElement | null}
      */
      const hashDebug = document.querySelector('#hash-debug');

      /**
       * @type {HTMLPreElement | null}
      */
      const dataDebug = document.querySelector('#data-debug');

      /**
       * @type {HTMLPreElement | null}
      */
      const redirectDebug = document.querySelector('#redirect-debug');

      /**
       * @type {boolean}
      */
      let isRedirectEnabled = JSON.parse(localStorage.getItem('isRedirectEnabled') ?? 'true');

      /**
       * @type {number | undefined}
      */
      let timeout;

      /**
       * @type {string | undefined}
      */
      let objectUrl;

      // https://stackoverflow.com/a/64752311
      /**
       * @param {string} input
      */
      const decodeBase64 = (input) => {
        const text = atob(input);
        const length = text.length;
        const bytes = new Uint8Array(length);
        for (let i = 0; i < length; i++) {
          bytes[i] = text.charCodeAt(i);
        }
        // const decoder = new TextDecoder();
        // return decoder.decode(bytes);

        return bytes;
      };

      /**
       * @param {string | undefined} hash
       * @param {boolean | undefined} preventRedirect
      */
      const readHash = (hash, preventRedirect = false) => {
        if (link) link.href = '';
        clearTimeout(timeout);

        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = undefined;
        }

        if (redirectEnableButton) {
          redirectEnableButton.innerText = `enable redirect: ${JSON.stringify(isRedirectEnabled)}`;
        }

        if (!hash) return;

        const payload = hash.charAt(0) === '#' ? hash.slice(1) : hash;
        if (!payload.length) return;

        const match = parseDataUrl.exec(payload);
        if (!match) return;

        const {
          groups: {
            data: data_ = undefined,
            params: params_ = undefined,
            type: type_ = 'text/plain',
          } = {},
        } = match;

        /**
         * @type {Record<string, string | undefined>}
         */
        const params = params_ ? Object.fromEntries(
          params_
            .split(';')
            .map((param) => {
              const paramMatch = parseParam.exec(param);
              if (!paramMatch) return;

              const {
                groups: {
                  key = undefined,
                  value = undefined,
                } = {},
              } = paramMatch;
              if (!key) return;

              return [key, value];
            })
            .filter(Boolean)
        ) : {};

        const isBase64 = Object.keys(params).includes('base64');
        const data = data_
          ? isBase64
            ? decodeBase64(data_)
            : decodeURIComponent(data_)
          : undefined;

        const { charset = (isBase64 ? 'utf-8' : 'us-ascii') } = params;
        const type = `${type_};charset=${charset}`;

        const blob = data ? new Blob([data], { type }) : undefined;

        if (hashDebug) {
          hashDebug.innerText = JSON.stringify({
            charset,
            isBase64,
            isRedirectEnabled,
            params_,
            params,
            preventRedirect,
            type_,
            type,
          }, undefined, 2);
        }
        
        if (dataDebug) {
          dataDebug.innerText = JSON.stringify({
            data_,
            data,
            hash,
            payload,
          }, undefined, 2);
        }

        if (!blob) return;

        objectUrl = URL.createObjectURL(blob);
        const redirect = new URL(objectUrl);

        const redirectParams = new URLSearchParams();
        for (const [key, value] of Object.entries(params)) {
          redirectParams.set(key, value ?? '');
        }
        redirectParams.sort();
        redirect.hash = redirectParams.toString();

        if (link) link.href = redirect.href;
        if (redirectDebug) {
          redirectDebug.innerText = redirect.href;
        }

        if (isRedirectEnabled && !preventRedirect) {
          timeout = setTimeout(() => location.assign(redirect), 3000);
        }
      };

      onhashchange = ({ newURL }) => {
        if (!URL.canParse(newURL)) return;

        const { hash } = new URL(newURL);
        readHash(hash);
      };

      if (input) {
        input.oninput = () => {
          const { value } = input;
          if (!value.length) return;

          readHash(value, true);
        };
      }

      if (redirectEnableButton) {
        redirectEnableButton.onclick = () => {
          isRedirectEnabled = !isRedirectEnabled;
          localStorage.setItem('isRedirectEnabled', JSON.stringify(isRedirectEnabled));
  
          readHash(location.hash);
        };
      }

      readHash(location.hash);
    </script>
  </body>
</html>
