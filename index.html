<html>
  <head>
    <title>Redirect to Blob</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="display:flex;flex-direction:column;gap:3rem;justify-content:center;align-items:center;">
    <a>click me</a>
    <pre id="url-debug" tabindex="0"></pre>
    <pre id="redirect-debug"></pre>
    <script type="module">
      const parseDataUrl = new RegExp('^data:(?<type>.+?/.+?)?(?:;(?<params>.+?))?,(?<data>.*)$');
      const parseParam = new RegExp('^(?<key>.+?)(?:=(?<value>.*))?$');

      /**
       * @type {HTMLAnchorElement | null}
      */
      const link = document.querySelector('a');

      /**
       * @type {HTMLPreElement | null}
      */
      const urlDebug = document.querySelector('#url-debug');

      /**
       * @type {HTMLPreElement | null}
      */
      const redirectDebug = document.querySelector('#redirect-debug');

      /**
       * @type {boolean}
      */
      let isRedirectEnabled = JSON.parse(localStorage.getItem('isRedirectEnabled') ?? 'true');

      /**
       * @type {number | undefined}
      */
      let timeout;

      /**
       * @type {string | undefined}
      */
      let objectUrl;

      // https://stackoverflow.com/a/64752311
      /**
       * @param {string} input
      */
      const decodeBase64 = (input) => {
        const text = atob(input);
        const length = text.length;
        const bytes = new Uint8Array(length);
        for (let i = 0; i < length; i++) {
          bytes[i] = text.charCodeAt(i);
        }
        // const decoder = new TextDecoder();
        // return decoder.decode(bytes);

        return bytes;
      };

      /**
       * @param {string | undefined} hash
      */
      const readHash = (hash) => {
        if (link) link.href = '';
        clearTimeout(timeout);

        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = undefined;
        }

        if (!hash) return;

        const payload = hash.slice(1);
        if (!payload.length) return;

        const match = parseDataUrl.exec(payload);
        if (!match) return;

        const {
          groups: {
            data: data_ = undefined,
            params: params_ = undefined,
            type: type_ = 'text/plain',
          } = {},
        } = match;

        /**
         * @type {Record<string, string | undefined>}
         */
        const params = params_ ? Object.fromEntries(
          params_
            .split(';')
            .map((param) => {
              const paramMatch = parseParam.exec(param);
              if (!paramMatch) return;

              const {
                groups: {
                  key = undefined,
                  value = undefined,
                } = {},
              } = paramMatch;
              if (!key) return;

              return [key, value];
            })
            .filter(Boolean)
        ) : {};

        const isBase64 = Object.keys(params).includes('base64');
        const data = data_
          ? isBase64
            ? decodeBase64(data_)
            : decodeURIComponent(data_)
          : undefined;

        const { charset = 'US-ASCII' } = params;
        const type = `${type_};charset=${charset}`;

        const blob = data ? new Blob([data], { type }) : undefined;

        if (urlDebug) {
          urlDebug.innerText = JSON.stringify({
            charset,
            data_,
            data,
            hash,
            isBase64,
            isRedirectEnabled,
            params_,
            params,
            type_,
            type,
          }, undefined, 2);
        }

        if (!blob) return;

        objectUrl = URL.createObjectURL(blob);
        const redirect = new URL(objectUrl);

        const redirectParams = new URLSearchParams();
        for (const [key, value] of Object.entries(params)) {
          redirectParams.set(key, value ?? '');
        }
        redirectParams.sort();
        redirect.hash = redirectParams.toString();

        if (link) link.href = redirect.href;
        if (redirectDebug) {
          redirectDebug.innerText = redirect.href;
        }

        if (isRedirectEnabled) {
          timeout = setTimeout(() => location.assign(redirect), 1000);
        }
      };

      onhashchange = ({ newURL }) => {
        if (!URL.canParse(newURL)) return;

        const { hash } = new URL(newURL);
        readHash(hash);
      };

      urlDebug?.onclick = () => {
        isRedirectEnabled = !isRedirectEnabled;
        localStorage.setItem('isRedirectEnabled', JSON.stringify(isRedirectEnabled));

        readHash(location.hash);
      };

      readHash(location.hash);
    </script>
  </body>
</html>
