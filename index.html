<html>
  <head>
    <title>Redirect</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <script>
      (() => {
        const { hash } = location;
        const redirect = hash.slice(1);
        if (!redirect.length) return;
        location.replace(redirect);
      })();
    </script>
  </body>
</html>
